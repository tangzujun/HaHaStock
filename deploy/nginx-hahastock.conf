# 行情通 · 静态站点 nginx 配置（参考文件，实际由 server-setup.sh 生成并启用）
# 默认监听 80 / 443。若 IP 访问被备案监测拦了，把下面的 80/443 改成 8080/8443 即可（防火墙也要同步放行）。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/hahastock;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/hahastock.access.log;
    error_log  /var/log/nginx/hahastock.error.log;

    # index.html 频繁更新，不缓存；config/skills 同理
    location ~* \.(html|json|md)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # vendor/ 下的第三方库可长缓存（配合 localize-cdn.sh）
    location ^~ /vendor/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json text/plain;
    gzip_min_length 1024;
    client_max_body_size 10m;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    root /var/www/hahastock;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/hahastock.access.log;
    error_log  /var/log/nginx/hahastock.error.log;

    location ~* \.(html|json|md)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ^~ /vendor/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json text/plain;
    gzip_min_length 1024;
    client_max_body_size 10m;
}
